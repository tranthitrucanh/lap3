<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="public/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="navbar">
        <a href="index.html">Home</a> |
        <a href="login.html" class="active">Đăng nhập</a> |
        <a href="register.html">Đăng ký</a>
      </header>

      <main class="login-box">
        <h2>Màn hình đăng nhập</h2>
        <form id="loginForm">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div class="options">
            <label class="remember-me">
              <input type="checkbox" checked /> Ghi nhớ đăng nhập
            </label>
          </div>

          <div class="actions">
            <a href="register.html" class="forgot-pwd">Chưa có tài khoản?</a>
            <button type="submit" class="btn-login">Đăng nhập</button>
          </div>
        </form>
      </main>

      <footer class="footer">Lập trình web @03/2026</footer>
    </div>

    <script src="public/js/script.js"></script>
  </body>
</html>
