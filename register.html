<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
    <link rel="stylesheet" href="public/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="navbar">
        <a href="index.html">Home</a> | <a href="login.html">Đăng nhập</a> |
        <a href="register.html" class="active">Đăng ký</a>
      </header>

      <main class="login-box">
        <h2>Màn hình đăng ký</h2>
        <form id="registerForm">
          <div class="input-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" name="username" required />
          </div>
          <div class="input-group">
            <label for="reg-password">Mật khẩu</label>
            <input type="password" id="reg-password" name="password" required />
          </div>
          <div class="input-group">
            <label for="re-password">Nhập lại mật khẩu</label>
            <input
              type="password"
              id="re-password"
              name="re-password"
              required
            />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="actions">
            <a href="login.html" class="forgot-pwd">Đã có tài khoản</a>
            <button type="submit" class="btn-login">Đăng ký</button>
          </div>
        </form>
      </main>

      <footer class="footer">Lập trình web @03/2026</footer>
    </div>

    <script src="public/js/script.js"></script>
  </body>
</html>
