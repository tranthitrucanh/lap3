<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cập nhật người dùng</title>
    <link rel="stylesheet" href="public/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="navbar">
        <a href="index.html">Home</a> | <a href="login.html">Đăng nhập</a> |
        <a href="register.html">Đăng ký</a>
      </header>

      <main class="login-box">
        <h2>Màn hình cập nhật</h2>
        <form id="updateForm">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="xxx" />
          </div>
          <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="xxx" />
          </div>
          <div class="input-group">
            <label for="re-password">Nhập lại mật khẩu</label>
            <input type="password" id="re-password" placeholder="xxx" />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="xxx@gmail.com" />
          </div>

          <div class="actions">
            <a href="view.html" class="forgot-pwd">Hủy bỏ</a>
            <button type="submit" class="btn-login">Cập nhật</button>
          </div>
        </form>
      </main>

      <footer class="footer">Lập trình web @03/2026</footer>
    </div>

    <script src="public/js/script.js"></script>
  </body>
</html>
